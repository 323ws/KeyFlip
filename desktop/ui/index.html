<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyFlip</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    /* Desktop optimization */
    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .app-window {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="app-window">
    
    <!-- VIEW 1: MAIN DASHBOARD -->
    <div id="mainView" class="view-screen active">
      <header class="top-nav">
        <div class="nav-brand">
          <div class="nav-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="4" />
              <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M18 12h.01M8 16h8" />
            </svg>
          </div>
          <span class="nav-title">KeyFlip</span>
        </div>

        <div class="nav-actions">
          <!-- Interface Language Toggle (AR / EN) -->
          <button id="uiLangToggle" class="nav-text-btn" title="Switch Interface Language / تغيير لغة الواجهة">
            <span id="uiLangText">عربي</span>
          </button>

          <!-- Theme Toggle -->
          <button id="themeToggle" class="nav-icon-btn" title="Toggle Theme (Dark / Light)">
            <svg id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="sunIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <main class="hero-body">
        <div class="hero-graphic-wrap">
          <div id="statusCircle" class="status-circle active">
            <svg id="heroActiveIcon" class="hero-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16" />
            </svg>
            <svg id="heroDisabledIcon" class="hero-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
          </div>
        </div>

        <h2 id="mainStatusTitle" class="hero-title">Auto Corrector Active</h2>
        <p id="mainStatusDesc" class="hero-desc">
          Select text & press <span class="badge-shortcut">Ctrl + Space</span> to convert.
        </p>

        <div class="lang-selector-card">
          <div class="lang-pair-row">
            <button type="button" id="openLang1Btn" class="lang-pill-btn" title="Change Primary Language">
              <span class="pill-label" id="pillLabel1">Language 1</span>
              <span class="pill-val" id="lang1Name">English (US)</span>
            </button>

            <button id="swapLayoutsBtn" class="swap-action-btn" title="Swap Languages">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16" />
              </svg>
            </button>

            <button type="button" id="openLang2Btn" class="lang-pill-btn" title="Change Secondary Language">
              <span class="pill-label" id="pillLabel2">Language 2</span>
              <span class="pill-val" id="lang2Name">العربية (101)</span>
            </button>
          </div>
        </div>

        <div id="sandboxDrawer" class="sandbox-drawer">
          <div class="sandbox-input-line">
            <input type="text" id="testInput" class="simple-input" placeholder="Test conversion here..." />
            <button id="convertBtn" class="btn-action-convert" title="Convert">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>
          </div>
        </div>

        <a id="kofiBtn" href="https://ko-fi.com/N4N21X8U7I" target="_blank" class="kofi-button" title="Support me on Ko-fi">
          <svg class="kofi-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.453-4.047 3.977-4.047 3.977s-2.793-2.516-4.043-3.977c-1.424-1.66-1.077-3.922.775-4.815 1.854-.895 3.268.498 3.268.498s1.416-1.393 3.27-.498c1.854.893 2.201 3.155.777 4.815zm6.541.493c-.476 1.096-1.523 1.258-1.523 1.258V6.438s1.267-.061 1.748 1.037c.48 1.096.251 4.382-.225 5.478z"/>
          </svg>
          <span id="kofiText">Support me on Ko-fi</span>
        </a>
      </main>

      <footer class="bottom-bar">
        <div class="footer-links">
          <button id="customizeShortcutBtn" class="footer-link-btn" title="Customize Shortcut">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h8"></path>
            </svg>
            <span id="currentShortcutDisplay">Ctrl + Space</span>
          </button>
        </div>

        <div class="footer-switch-wrap">
          <label class="pill-switch" title="Enable / Disable">
            <input type="checkbox" id="enableSwitch" checked>
            <span class="pill-slider">
              <span class="pill-text on-text">ON</span>
              <span class="pill-text off-text">OFF</span>
              <span class="pill-knob"></span>
            </span>
          </label>
        </div>
      </footer>
    </div>

    <!-- VIEW 2: DEDICATED LANGUAGE PICKER SCREEN -->
    <div id="pickerView" class="view-screen">
      <header class="picker-header">
        <button id="pickerBackBtn" class="picker-back-btn" title="Back">
          <svg id="backArrowIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>
        <span id="pickerTitle" class="picker-title">Select Language</span>
        <div style="width: 28px;"></div>
      </header>

      <div class="picker-search-wrap">
        <input type="text" id="langSearchInput" class="picker-search-input" placeholder="🔍 Search language..." />
      </div>

      <div id="pickerLangList" class="picker-lang-list"></div>
    </div>

    <!-- MODAL: CUSTOMIZE SHORTCUT -->
    <div id="shortcutModal" class="modal-overlay hidden">
      <div class="modal-card">
        <header class="modal-header">
          <div class="modal-title-row">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h8"></path>
            </svg>
            <span id="modalShortcutTitle">Customize Shortcut</span>
          </div>
          <button type="button" id="closeShortcutModalBtn" class="modal-close-btn">&times;</button>
        </header>

        <div class="modal-body">
          <p id="modalShortcutDesc" class="modal-hint">
            Click the box below and press your keys (or pick from presets):
          </p>

          <!-- Interactive Shortcut Recorder Box -->
          <div id="shortcutRecorderBox" class="shortcut-recorder-box" tabindex="0">
            <span id="recorderStatusText" class="recorder-prompt">Click here and press keys...</span>
            <div id="recorderKeyDisplay" class="recorder-keys hidden"></div>
          </div>

          <!-- Quick Presets -->
          <div class="shortcut-presets">
            <span id="presetsLabel" class="presets-title">Common Presets:</span>
            <div class="preset-buttons-grid">
              <button type="button" class="preset-pill-btn" data-shortcut="Alt+X">Alt + X</button>
              <button type="button" class="preset-pill-btn" data-shortcut="Ctrl+Shift+X">Ctrl + Shift + X</button>
              <button type="button" class="preset-pill-btn" data-shortcut="Alt+Z">Alt + Z</button>
              <button type="button" class="preset-pill-btn" data-shortcut="Ctrl+Space">Ctrl + Space</button>
              <button type="button" class="preset-pill-btn" data-shortcut="Ctrl+Alt+X">Ctrl + Alt + X</button>
              <button type="button" class="preset-pill-btn" data-shortcut="F4">F4</button>
            </div>
          </div>
        </div>

        <footer class="modal-footer">
          <button type="button" id="cancelShortcutBtn" class="btn-secondary">Cancel</button>
          <button type="button" id="saveShortcutBtn" class="btn-primary">Save Shortcut</button>
        </footer>
      </div>
    </div>

  </div>

  <script src="bridge.js"></script>
  <script src="layouts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
